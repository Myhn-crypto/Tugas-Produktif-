<!DOCTYPE html>
<HTML>
    <h3>Data Diri Siswa</h3>
    <form>
        <label>Nama Lengkap :</label>
        <input type="text" name="nama" placeholder="Masukkan nama" required>
        <br>
         <label>Nomor Induk Asal :</label>
        <input type="number" name="Nomor Induk Asal" placeholder="Masukan Nomor Induk Asal">
        <br>
        <label>NISN</label>
        <input type="number" name="NISN" placeholder="Masukan NISN">
        <br>
        <label>Tanggal Lahir</label>
        <input type="date" name="Tanggal Lahir" placeholder="Masukan Tanggal Lahir">
        <br>
        <label>Jenis Kelamin</label>
        <input type="radio" name="jk" value="L"> Laki-laki
        <input type="radio" name="jk" value="P"> Perempuan
        <br>
        <label> Anak ke :</label>
        <input type="number" name="anak ke" placeholder="Anak ke" required>
        <br>
        <label> Status Anak Dalam Keluarga :</label>
        <input type="radio" name="jk" value="Status"> Anak Kandung
        <input type="radio" name="jk" value="Status"> Anak Angkat
        <input type="radio" name="jk" value="Lainnya"> Lainnya
        <br>
        <label> Alamat Siswa :</label>
        <input type="varchar" name="Alamat" placeholder="Alamat" required>
        <br>
        <label>Nomor Telepon Siswa</label>
        <input type="number" name="No Telepon" placeholder="Masukan no telepon">
        <br>
        <label>Sekolah Asal</label>
        <input type="text" name="Asal Sekolah" placeholder="Masukkan nama sekolah" required>
        <br>
    <h3>Data Orang Tua Kandung</h3>
        <label>Nama Lengkap Ayah:<label>
        <input type="text" name="nama ayah" placeholder="Masukkan nama ayah" required>
        <br>
        <label>Nama Lengkap Ibu:<label>
        <input type="text" name="nama ibu" placeholder="Masukkan nama ibu" required>
        <br>
        <label> Alamat :</label>
        <input type="varchar" name="Alamat" placeholder="Alamat" required>
        <br>
        <label>Nomor Telepon</label>
        <input type="number" name="No Telepon" placeholder="Masukan no telepon">
        <br>
        <label>Pekerjaan Ayah:<label>
        <input type="text" name="pekerjaan ayah" placeholder="Pekerjaan ayah" required>
        <br>
        <label>Pekerjaan ibu:<label>
        <input type="text" name="pekerjaan ibu" placeholder="Pekerjaan ibu" required>
        <br>
        <label>Pendidikan Terakhir ayah:<label>
        <input type="text" name="pendidikan terakhir ayah" placeholder="Pendidikan terakhir ayah" required>
        <br>
            <label>Pendidikan Terakhir ibu<label>
        <input type="text" name="pendidikan terakhir ibu" placeholder="Pendidikan terakhir ibu" required>
    </form>
</HTML>
